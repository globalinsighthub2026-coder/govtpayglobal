<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovtPay Global</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GovtPay Global</h1>
        <p>आपकी डिजिटल सेवाओं और प्रोजेक्ट्स का मुख्य प्लेटफ़ॉर्म। Vercel पर आपकी वेबसाइट सफलतापूर्वक लाइव हो चुकी है।</p>
        <a href="#" class="btn">एक्सप्लोर करें</a>
        <div class="footer">
            &copy; 2026 GovtPay Global. सर्वाधिकार सुरक्षित।
        </div>
    </div>

</body>
  </html>
